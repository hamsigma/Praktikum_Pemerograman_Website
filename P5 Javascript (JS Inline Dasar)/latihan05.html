<!DOCTYPE html>
<html>
<head>
  <title>Latihan 05 - Metode dalam Objek</title>
  <script>
    var siswa = {
      nama: "Budi",
      tampilNama: function() {
        return "Nama siswa: " + this.nama;
      }
    };
    document.write(siswa.tampilNama());
  </script>
</head>
<body>
</body>
</html>

<!-- Metode Dalam Objek -->
