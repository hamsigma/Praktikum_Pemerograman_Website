<!DOCTYPE html>
<html>
<head>
  <title>Latihan 09 - Relational</title>
  <script>
    var x = 10;
    var y = 20;
    document.write("x == y : " + (x == y) + "<br>");
    document.write("x != y : " + (x != y) + "<br>");
    document.write("x > y : " + (x > y) + "<br>");
    document.write("x < y : " + (x < y));
  </script>
</head>
<body>
</body>
</html>

<!-- Relational -->
