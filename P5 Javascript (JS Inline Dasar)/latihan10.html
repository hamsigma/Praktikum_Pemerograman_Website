<!DOCTYPE html>
<html>
<head>
  <title>Latihan 10 - If Else</title>
  <script>
    var nilai = prompt("Masukkan nilai Anda:");
    if (nilai >= 60) {
      document.write("Selamat, Anda Lulus!");
    } else {
      document.write("Maaf, Anda Tidak Lulus!");
    }
  </script>
</head>
<body>
</body>
</html>

<!-- Seleksi If - Else -->
