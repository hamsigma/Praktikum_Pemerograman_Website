<!DOCTYPE html>
<html>
<head>
  <title>Soal 2 - Pengulangan Input</title>
  <script>
    var jumlah = prompt("Masukkan jumlah perulangan:");
    jumlah = parseInt(jumlah);

    document.write("<h2>Hasil Perulangan</h2>");
    for (var i = 1; i <= jumlah; i++) {
      document.write("Ini adalah perulangan ke-" + i + "<br>");
    }
  </script>
</head>
<body>
</body>
</html>
