<!DOCTYPE html>
<html>
<head>
  <title>Latihan 08 - Aritmatika</title>
  <script>
    var a = 10;
    var b = 5;
    document.write("Penjumlahan: " + (a + b) + "<br>");
    document.write("Pengurangan: " + (a - b) + "<br>");
    document.write("Perkalian: " + (a * b) + "<br>");
    document.write("Pembagian: " + (a / b) + "<br>");
    document.write("Modulus: " + (a % b));
  </script>
</head>
<body>
</body>
</html>

<!-- Aritmatika -->
